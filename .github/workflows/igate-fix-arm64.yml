name: Graywolf iGate fix ARM64

on:
  push:
    branches:
      - fix/igate-preserve-path-qconstruct
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-go:
    name: Build Graywolf Go server (linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded web interface
        run: |
          cd web
          npm ci --no-audit --no-fund --include=optional
          npm run build

      - name: Test affected Go packages
        run: go test ./pkg/igate ./pkg/app

      - name: Cross-compile Raspberry Pi binary
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist-pi
          go build -trimpath -ldflags="-s -w -X main.Version=0.14.14-igatefix -X main.GitCommit=${GITHUB_SHA::8}" -o dist-pi/graywolf ./cmd/graywolf/
          file dist-pi/graywolf
          sha256sum dist-pi/graywolf > dist-pi/sha256.txt

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v5
        with:
          name: graywolf-igate-fix-linux-arm64
          path: dist-pi/
          if-no-files-found: error
          retention-days: 14
