name: GPS review regression tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gps-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-gps-review-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Isolate GPS tests from pre-existing USB test compilation errors
        run: |
          python - <<'PY'
          from pathlib import Path
          for test in Path("android/app/src/test/kotlin").rglob("*.kt"):
              if test.name != "GpsAdapterTest.kt":
                  test.unlink()
          PY
      - name: Run GPS adapter JVM regression tests
        working-directory: android
        env:
          ANDROID_NDK_ROOT: /tmp/unused-ndk
        run: ./gradlew :app:testDebugUnitTest --tests 'com.nw5w.graywolf.gps.GpsAdapterTest' -x cargoNdkBuild -x goCrossCompile -x checkAndroidToolchain --no-daemon --stacktrace
